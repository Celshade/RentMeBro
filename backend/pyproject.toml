[project]
name = "rentmebro-backend"
version = "0.0.2"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=6.0.7",
    "django-cors-headers>=4.9.0",
    "django-environ>=0.14.0",
    "djangorestframework>=3.17.1",
    "djangorestframework-simplejwt>=5.5.1",
    "drf-spectacular>=0.30.0",
    "psycopg[binary]>=3.3.4",
    "requests>=2.32.5",
    "stripe>=15.3.0",
]

[dependency-groups]
dev = [
    "factory-boy>=3.3.3",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.12.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.22",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["src"]
python_files = ["test_*.py"]
testpaths = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 80
src = ["src"]

[tool.ruff.lint]
select = ["Q", "E501", "ANN"]
# ANN401: Any is the correct type for *args/**kwargs passthrough hooks
# (Django save(), DRF retrieve/create/destroy(*args, **kwargs)).
ignore = ["ANN401"]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "double"
docstring-quotes = "double"
multiline-quotes = "double"

[tool.ruff.lint.per-file-ignores]
"*/migrations/*" = ["Q", "E501", "ANN"]
"*/tests/*" = ["E501", "ANN"]
"conftest.py" = ["E501", "ANN"]
